# Standalone production stack; does not merge the development Compose file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saraang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: saraang_db
    volumes:
      - production_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U saraang -d saraang_db']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - production_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    command: [python, migrate.py]
    environment:
      DATABASE_URL: postgresql://saraang:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/saraang_db
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://saraang:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/saraang_db
      REDIS_URL: redis://redis:6379/0
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
    ports:
      - '127.0.0.1:${PRODUCTION_PORT:-8002}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    restart: unless-stopped
    init: true
    command: [celery, -A, notifier.celery_app, worker, --beat, --loglevel=info, -Q, notifications, --schedule=/tmp/celerybeat-schedule]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  production_postgres:
  production_redis:
